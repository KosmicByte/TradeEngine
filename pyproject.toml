[project]
name = "tradeengine"
version = "0.1.0"
description = "A comprehensive trading engine with backend services and ML integrations."
readme = "README.md"
requires-python = "==3.11.*"
authors = [
  { name = "Abhinav Mishra", email = "mishraabhinav36@gmail.com" },
  { name = "Aditya Mishra", email = "mishraraghav36@gmail.com" }
]
dependencies = [
  "fastapi==0.110.3",
  "uvicorn==0.30.6",
  "pydantic==2.11.7",
  "requests[socks]==2.32.4",
  "numpy==1.26.4",
  "pandas==2.3.1",
  "matplotlib==3.10.5",
  "beautifulsoup4==4.13.4",
  "textblob==0.18.0.post0",
  "tweepy==4.16.0",
  "upstox-python-sdk==2.17.0",
  "gym==0.26.2",
  "stable-baselines3==2.7.0",
  "optuna==3.6.2",
  "onnx==1.18.0",
  "onnxruntime==1.22.1",
  "shap==0.45.1",
  "papermill==2.6.0",
  "nbformat==5.10.4",
  "reportlab==4.4.3",
  "dvc==3.61.0",
  "python-multipart==0.0.9",
  "python-dotenv==1.1.1",
  "ta>=0.11,<0.12",
  "nsepython>=2.97",
  "snakeviz>=2.2.2",
  "snakemake>=7.32.4",
  "pytz>=2025.2",
  "playwright>=1.55.0",
  "curl-cffi>=0.13.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.2.1",
  "black==24.3.0",
  "flake8==7.0.0",
  "mypy==1.10.0",
  "isort==5.13.2",
  "pre-commit==3.6.2",
  "jupyter==1.0.0",
  "notebook==7.2.0",
  "streamlit==1.35.0",
  "locust==2.24.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tradesystem"]

[tool.hatch.build.targets.sdist]
include = ["src/tradesystem", "pyproject.toml", "README.md", "LICENSE", "NOTICE"]
