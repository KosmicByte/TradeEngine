[project]
name = "stochax-market"
version = "0.5.0"
description = "Stochastic PDE-based stock market simulation, calibration, and prediction using JAX."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Abhinav Mishra", email = "mishraabhinav36@gmail.com" },
  { name = "Aditya Mishra", email = "mishraraghav36@gmail.com" },
]
dependencies = [
  "jaxlib>=0.4.25",
  "equinox>=0.11.0",
  "exponax>=0.1.0",
  "optimistix>=0.0.8",
  "lineax>=0.0.6",
  "pandas>=2.0.0",
  "numpy>=1.26.0",
  "typer>=0.12.0",
  "rich>=13.0.0",
  "matplotlib>=3.8.0",
  "plotly>=6.6.0",
  "kaleido>=1.2.0",
  "hmmlearn>=0.3.3",
  "scipy>=1.17.1",
  "pydantic>=2.13.4",
  "pydantic-settings>=2.14.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
stochax-simulate  = "stochax_market.cli:simulate_app"
stochax-fit       = "stochax_market.cli:fit_app"
stochax-predict   = "stochax_market.cli:predict_app"
stochax-merge     = "stochax_market.cli:merge_app"
stochax-diagnose  = "stochax_market.cli:diagnose_app"
stochax-visualize = "stochax_market.cli:visualize_app"
stochax-export    = "stochax_market.cli:export_app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stochax_market"]

[tool.hatch.build.targets.sdist]
include = ["src/stochax_market", "pyproject.toml", "README.md"]

[tool.uv]
dev-dependencies = [
  "pytest>=8.0.0",
]
